name: Deploy site

# Builds the React app in app/ and publishes it to GitHub Pages (Settings > Pages > Source: GitHub Actions).
# A push made with the built-in GITHUB_TOKEN does not start other workflows, so the schedule import cannot
# trigger this one with its commit. The workflow_run trigger below deploys after the import finishes instead.

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Import class schedule"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # After an import run, deploy only when the import succeeded.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install packages
        run: npm ci
        working-directory: app
      - name: Test the engine and the plan model
        run: node --test tests/
      - name: Build the site
        run: npm run build
        working-directory: app
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
