name: Import class schedule

# Reads MTSU's public class schedule, parses it, derives offering patterns, and commits the changed
# files under data/. Run it by hand from the Actions tab, or let the monthly schedule run it.

on:
  workflow_dispatch:
    inputs:
      first_term:
        description: "First term to import, for example 2018FA"
        required: false
        default: "2018FA"
      last_term:
        description: "Last term to import, for example 2027SP. Leave empty for the newest term listed."
        required: false
        default: ""
  schedule:
    # 06:17 UTC on the first day of every month
    - cron: "17 6 1 * *"

permissions:
  contents: write

concurrency:
  group: import-schedule
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: importer/requirements.txt

      - name: Install the importer's packages
        run: pip install -r importer/requirements.txt

      - name: Run the importer
        env:
          FIRST_TERM: ${{ inputs.first_term }}
          LAST_TERM: ${{ inputs.last_term }}
        run: |
          first="${FIRST_TERM:-2018FA}"
          args=(--first "$first" --subjects ENGR MATH PHYS CHEM CSCI)
          if [ -n "${LAST_TERM}" ]; then
            args+=(--last "${LAST_TERM}")
          fi
          python importer/run_import.py "${args[@]}"

      - name: Commit changed data files
        if: ${{ !cancelled() }}
        run: |
          git config user.name "schedule-importer"
          git config user.email "schedule-importer@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes under data/."
          else
            git commit -m "Update class schedule data"
            git push
          fi
