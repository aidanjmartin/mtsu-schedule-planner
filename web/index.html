<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>MTSU Degree Planner</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Graph libraries. The page still works without them: the Graph view shows a text list instead. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dagre/0.8.5/dagre.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape-dagre/2.5.0/cytoscape-dagre.min.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to the content</a>

  <header class="top">
    <div class="top-row">
      <div class="brand">
        <h1>MTSU Degree Planner</h1>
        <p class="sub" id="program">Mechatronics Engineering, B.S.</p>
      </div>
      <div class="tools">
        <label class="field-inline">Catalog year
          <select id="catalog-year" aria-label="Catalog year"></select>
        </label>
        <button type="button" id="btn-export">Export</button>
        <label class="button" for="file-import">Import</label>
        <input type="file" id="file-import" accept="application/json,.json" hidden>
        <button type="button" id="btn-reset">Reset</button>
        <button type="button" id="btn-theme" aria-label="Change theme">Theme: Auto</button>
      </div>
    </div>
    <nav class="tabs" role="tablist" aria-label="Views" id="tabs"></nav>
  </header>

  <div id="notices" aria-live="polite"></div>
  <main id="main" tabindex="-1"></main>

  <footer class="foot">
    <p>This page runs in your browser. Your choices stay on this device. Nothing is sent anywhere.</p>
    <p id="data-note"></p>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
